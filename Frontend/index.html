<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regulatory Circulars & Notices - Priority & Summary</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons (Vanilla) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .table-container::-webkit-scrollbar { 
            width: 8px; 
            height: 8px; 
        }
        .table-container::-webkit-scrollbar-track { 
            background: #f1f1f1; 
            border-radius: 4px; 
        }
        .table-container::-webkit-scrollbar-thumb { 
            background: #cbd5e1; 
            border-radius: 4px; 
        }
        .table-container::-webkit-scrollbar-thumb:hover { 
            background: #94a3b8; 
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const host = window.location.hostname;
        const API_BASE = host === "127.0.0.1" || host === "localhost"
            ? "http://127.0.0.1:8000"
            : "https://regulatory-circulars-notices.onrender.com";
            
        const PAGE_SIZE = 50;

        const toISODate = (d) => d.toISOString().slice(0, 10);
        const todayISO = toISODate(new Date());
        const sevenDaysAgoISO = toISODate(new Date(Date.now() - 7 * 24 * 60 * 60 * 1000));

        // Keyword Lists mapped to Regex
        const P1_WORDS = ['span', 'price scan range', 'extreme loss margin', '\\belm\\b', 'mpor', 'initial margin', 'pre-expiry margin', 'pre expiry margin', 'tender margin', 'additional surveillance', 'position limit', 'market wide position limit', '\\bmwpl\\b', 'conversion', 'reversal', 'calendar spread', 'delta based', 'futures equivalent', 'futeq', 'lot size', 'market lot', 'quantity freeze', 'expiry day', 'ban period', 'risk reduction mode'];
        const P2_WORDS = ['margin', 'derivatives', 'futures', 'options', 'f&o', 'exclusion of futures', 'contract specification', 'strike', 'settlement', 'due date rate', 'collateral', 'haircut', 'cross margin', 'fpi', 'foreign portfolio', 'surveillance', 'volatility'];
        const P3_WORDS = ['broker', 'trading member', 'clearing member', 'circular', 'consultation', 'master circular', 'compliance', 'internal audit', 'cyber', 'algo', 'connectivity', 'holiday', 'mock trading'];
        const DEMOTE_WORDS = ['graded surveillance', '\\bgsm\\b', '\\basm\\b', 'additional surveillance measure', 'enhanced surveillance measure', 'securities under ibc', 'empanel', 'algo provider', 'investor service', 'investor protection fund', 'arbitration', 'grievance', 'cyber security awareness', 'mock trading', 'recovery certificate', 'adjudication order', 'release order', 'listing of', 'bonus issue', 'rights issue', 'stock split', 'change in name'];

        const P1_REGEX = new RegExp(`(${P1_WORDS.join('|')})`, 'i');
        const P2_REGEX = new RegExp(`(${P2_WORDS.join('|')})`, 'i');
        const P3_REGEX = new RegExp(`(${P3_WORDS.join('|')})`, 'i');
        const DEMOTE_REGEX = new RegExp(`(${DEMOTE_WORDS.join('|')})`, 'i');

        // Function to score and tag individual items
        const assignPriority = (item) => {
            const title = item.title || "";
            let priority = null;

            if (P1_REGEX.test(title)) priority = 'P1';
            else if (P2_REGEX.test(title)) priority = 'P2';
            else if (P3_REGEX.test(title)) priority = 'P3';

            // Forced Demotion Rule
            if (DEMOTE_REGEX.test(title)) {
                priority = 'P3';
            }

            return { ...item, priority };
        };

        // Helper to extract dividend amount
        const extractDividendAmount = (subject) => {
            if (!subject) return "";
            const match = subject.match(/Rs\.?\s*([\d.]+)/i);
            if (match && match[1]) {
                return `₹${match[1]}`;
            }
            return subject; 
        };
        
        const getRowKey = (row) => {
            if (row.id) return row.id;
            if (row.type === 'dividend') return `div-${row.symbol}-${row.ex_date}-${row.subject}`;
            return `not-${row.body}-${row.date}-${row.title?.substring(0,20)}`;
        };

        // Badge color mapping
        const BODY_STYLES = {
            NSE: 'bg-orange-50 text-orange-700 border-orange-200',
            NCL: 'bg-amber-50 text-amber-700 border-amber-200',
            BSE: 'bg-blue-50 text-blue-700 border-blue-200',
            SEBI: 'bg-emerald-50 text-emerald-700 border-emerald-200',
            MCX: 'bg-purple-50 text-purple-700 border-purple-200',
            MCXCCL: 'bg-fuchsia-50 text-fuchsia-700 border-fuchsia-200',
            IFSCA: 'bg-teal-50 text-teal-700 border-teal-200',
        };
        const bodyBadgeClass = (body) => BODY_STYLES[body] || 'bg-slate-50 text-slate-700 border-slate-200';

        // Safe Icon Component to bridge React and vanilla Lucide without DOM crashes
        const Icon = ({ name, className }) => {
            const spanRef = useRef(null);
            
            useEffect(() => {
                if (spanRef.current && window.lucide) {
                    spanRef.current.innerHTML = `<i data-lucide="${name}" class="${className || ''}"></i>`;
                    window.lucide.createIcons({ root: spanRef.current });
                }
            }, [name, className]);
            
            return <span ref={spanRef} style={{ display: 'contents' }}></span>;
        };

        const App = () => {
            // Filters
            const [filterTitle, setFilterTitle] = useState('');
            const [filterFromDate, setFilterFromDate] = useState(sevenDaysAgoISO);
            const [filterToDate, setFilterToDate] = useState(todayISO);
            const [filterBody, setFilterBody] = useState('All');
            const [filterCategory, setFilterCategory] = useState('All');
            
            const [activeQuickFilter, setActiveQuickFilter] = useState(null);

            // Data State
            const [allData, setAllData] = useState([]);
            const [sourceStatus, setSourceStatus] = useState({});
            const [fetchedAt, setFetchedAt] = useState(null);
            const [summaryStatus, setSummaryStatus] = useState(null);
            const [isLoading, setIsLoading] = useState(true);
            const [isRefreshing, setIsRefreshing] = useState(false);
            const [connectionError, setConnectionError] = useState(null);
            const [page, setPage] = useState(1);
            
            // Per-Row Summary State
            const [rowSummaries, setRowSummaries] = useState({});

            const [appliedDateRange, setAppliedDateRange] = useState({
                fromDate: sevenDaysAgoISO, toDate: todayISO
            });

            const loadData = async (forceRefresh = false) => {
                forceRefresh ? setIsRefreshing(true) : setIsLoading(true);
                setConnectionError(null);

                try {
                    const params = new URLSearchParams({
                        from_date: appliedDateRange.fromDate,
                        to_date: appliedDateRange.toDate,
                    });

                    if (forceRefresh) {
                        params.set("refresh", "true");
                    }

                    const response = await fetch(`${API_BASE}/api/notices?${params.toString()}`);

                    if (!response.ok) {
                        throw new Error(`Backend responded with ${response.status}`);
                    }

                    const json = await response.json();
                    
                    const scoredData = (json.data || []).map(assignPriority);

                    setAllData(scoredData);
                    setSourceStatus(json.source_status || {});
                    setFetchedAt(json.fetched_at || null);
                    setSummaryStatus(json.summary_status || null);

                } catch (error) {
                    console.error("Failed to reach backend:", error);
                    setConnectionError(`Can't reach the backend at ${API_BASE}. Make sure it's running.`);
                    setAllData([]);
                    setSourceStatus({});
                } finally {
                    setIsLoading(false);
                    setIsRefreshing(false);
                }
            };

            useEffect(() => { 
                loadData(false); 
            }, [appliedDateRange.fromDate, appliedDateRange.toDate]);

            // AI summaries are generated in the background on the server (hourly,
            // plus right after any fetch) - light polling here just picks up
            // newly-finished summaries without the visitor needing to do anything.
            useEffect(() => {
                const id = setInterval(() => {
                    loadData(false);
                }, 60000);
                return () => clearInterval(id);
            }, [appliedDateRange.fromDate, appliedDateRange.toDate]);

            const displayedData = useMemo(() => {
                let filtered = [];

                if (activeQuickFilter === "dividend") {
                    filtered = allData.filter(item => item.type === "dividend");

                    if (filterTitle.trim() !== "") {
                        const search = filterTitle.toLowerCase();
                        filtered = filtered.filter(item => {
                            const txt = [item.symbol, item.company, item.subject]
                                .filter(Boolean)
                                .join(" ")
                                .toLowerCase();
                            return txt.includes(search);
                        });
                    }

                    filtered.sort((a, b) => new Date(b.ex_date) - new Date(a.ex_date));
                } else {
                    filtered = allData.filter(item => {
                        if (item.type === "dividend") return false;

                        if (activeQuickFilter && activeQuickFilter.startsWith("P") && item.priority !== activeQuickFilter) {
                            return false;
                        }

                        const txt = [item.title, item.subject]
                            .filter(Boolean)
                            .join(" ")
                            .toLowerCase();

                        const matchesTitle = txt.includes(filterTitle.toLowerCase());
                        const matchesBody = filterBody === "All" || item.body === filterBody;
                        const matchesCategory = filterCategory === "All" || item.category === filterCategory;

                        return matchesTitle && matchesBody && matchesCategory;
                    });
                }
                return filtered;
            }, [allData, filterTitle, filterBody, filterCategory, activeQuickFilter]);
            
            useEffect(() => { 
                setPage(1); 
            }, [filterTitle, filterBody, filterCategory, activeQuickFilter]);

            const totalPages = Math.max(1, Math.ceil(displayedData.length / PAGE_SIZE));
            const pagedData = displayedData.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);

            const handleFilter = () => {
                setAppliedDateRange({ fromDate: filterFromDate, toDate: filterToDate });
                setPage(1);
            };

            const handleReset = () => {
                setFilterTitle(''); setFilterFromDate(sevenDaysAgoISO); setFilterToDate(todayISO);
                setFilterBody('All'); setFilterCategory('All');
                setActiveQuickFilter(null);
                setAppliedDateRange({ fromDate: sevenDaysAgoISO, toDate: todayISO });
                setPage(1);
            };
            
            const toggleQuickFilter = (type) => {
                setActiveQuickFilter(prev => {
                    const newFilter = prev === type ? null : type;
                    if (newFilter === 'dividend') {
                        setFilterBody('All');
                        setFilterCategory('All');
                    }
                    return newFilter;
                });
            };

            // AI summaries are normally already sitting on row.summary, generated
            // server-side by the backend (hourly, and right after any fetch) and
            // stored permanently so every visitor sees the same one for free.
            // This is only the fallback for a row that hasn't been reached yet -
            // it asks the backend to summarize just that one notice right now.
            // The backend endpoint itself is idempotent (returns the cached
            // summary instead of re-calling Gemini if one already exists), so
            // it's safe even if this gets clicked more than once.
            const handleGenerateNow = async (row) => {
                const rowKey = getRowKey(row);
                setRowSummaries(prev => ({ ...prev, [rowKey]: { loading: true } }));

                try {
                    const response = await fetch(`${API_BASE}/api/summaries/notice/${encodeURIComponent(row.id)}`, {
                        method: 'POST',
                    });
                    const result = await response.json();

                    if (result.status === 'ok' && result.summary) {
                        setRowSummaries(prev => ({ ...prev, [rowKey]: { loading: false, text: result.summary } }));
                    } else if (result.status === 'rate-limited') {
                        setRowSummaries(prev => ({ ...prev, [rowKey]: { loading: false, error: true, message: 'Gemini is rate-limited right now - try again in a minute.' } }));
                    } else if (result.status === 'no-key') {
                        setRowSummaries(prev => ({ ...prev, [rowKey]: { loading: false, error: true, message: 'AI summaries are not configured on the backend yet.' } }));
                    } else {
                        setRowSummaries(prev => ({ ...prev, [rowKey]: { loading: false, error: true } }));
                    }
                } catch (error) {
                    console.error("Summarization error:", error);
                    setRowSummaries(prev => ({ ...prev, [rowKey]: { loading: false, error: true } }));
                }
            };

            // A few NSE press-release titles bundle multiple clarifications
            // together separated by literal <br/> tags - show those as a plain
            // separator instead of the raw tag text.
            const cleanTitle = (text) => (text || "").replace(/<br\s*\/?>/gi, '; ');

            const sourceErrors = Object.entries(sourceStatus).filter(([, s]) => s.error);
            const sourceNotes = Object.entries(sourceStatus).filter(([, s]) => s.note && !s.error);
            const totalLive = Object.values(sourceStatus).reduce((sum, s) => sum + (s.count || 0), 0);
            
            const availableCategories = useMemo(() => {
                return [...new Set(allData.filter(item => item.type !== 'dividend').map(item => item.category))].filter(Boolean).sort();
            }, [allData]);

            return (
                <div className="min-h-screen p-4 md:p-8">
                    <div className="max-w-[1600px] mx-auto w-full space-y-6">
                        
                        {/* Header */}
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                            <div className="flex flex-col md:flex-row md:items-start md:justify-between gap-4">
                                <div>
                                    <h1 className="text-2xl font-bold text-slate-800 flex items-center gap-2">
                                        {activeQuickFilter === 'dividend' ? (
                                            <Icon name="banknote" className="w-6 h-6 text-emerald-600" />
                                        ) : (
                                            <Icon name="scroll-text" className="w-6 h-6 text-indigo-600" />
                                        )}
                                        {activeQuickFilter === 'dividend' ? 'NSE Corporate Actions – Dividends' : 'Regulatory Notices'}
                                    </h1>
                                    <p className="text-slate-500 mt-1">
                                        {activeQuickFilter === 'dividend' 
                                            ? 'Latest dividend announcements sorted by Ex-Date.' 
                                            : 'Live circulars and notices scored by priority relevance.'}
                                    </p>
                                </div>
                                <div className="flex items-center gap-3">
                                    <span className="text-xs text-slate-400 hidden md:inline">Window set by From/To Date below</span>
                                    <button
                                        onClick={() => loadData(true)}
                                        disabled={isRefreshing}
                                        className="bg-[#0a0a2a] hover:bg-[#1a1a4a] disabled:opacity-60 text-white font-medium py-2 px-4 rounded-lg shadow-md transition-colors flex items-center gap-2 text-sm"
                                    >
                                        <Icon name="refresh-cw" className={`w-4 h-4 ${isRefreshing ? 'animate-spin' : ''}`} />
                                        {isRefreshing ? 'Refreshing…' : 'Refresh Live Data'}
                                    </button>
                                </div>
                            </div>

                            {connectionError && (
                                <div className="mt-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg flex items-start gap-3 text-sm">
                                    <Icon name="wifi-off" className="w-5 h-5 flex-shrink-0 mt-0.5" />
                                    <p>{connectionError}</p>
                                </div>
                            )}

                            {!connectionError && sourceErrors && sourceErrors.length > 0 && (
                                <div className="mt-4 p-3 bg-amber-50 border border-amber-200 text-amber-700 rounded-lg flex items-start gap-3 text-sm">
                                    <Icon name="alert-triangle" className="w-5 h-5 flex-shrink-0 mt-0.5" />
                                    <div className="space-y-1">
                                        <p className="font-semibold">{sourceErrors.length} source{sourceErrors.length > 1 ? 's' : ''} returned no live data:</p>
                                        <ul className="list-disc pl-5 space-y-1">
                                            {sourceErrors.map(([name, s]) => (
                                                <li key={name}><span className="font-medium">{name}:</span> {s.error}</li>
                                            ))}
                                        </ul>
                                    </div>
                                </div>
                            )}

                            {!connectionError && sourceNotes && sourceNotes.length > 0 && (
                                <div className="mt-4 p-3 bg-sky-50 border border-sky-200 text-sky-700 rounded-lg flex items-start gap-3 text-sm">
                                    <Icon name="info" className="w-5 h-5 flex-shrink-0 mt-0.5" />
                                    <div className="space-y-1">
                                        {sourceNotes.map(([name, s]) => (
                                            <p key={name}><span className="font-medium">{name}:</span> {s.note}</p>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {!connectionError && !isLoading && (
                                <p className="mt-4 text-xs text-slate-400">
                                    {totalLive} live rows fetched{fetchedAt ? ` • last updated ${new Date(fetchedAt).toLocaleString("en-IN", { timeZone: "Asia/Kolkata" })}` : ''}
                                    {summaryStatus && summaryStatus.model ? ` • AI summaries: ${summaryStatus.generated}/${summaryStatus.generated + summaryStatus.pending} generated (${summaryStatus.model})` : ''}
                                    {summaryStatus && !summaryStatus.model ? ` • AI summaries disabled (no GEMINI_API_KEY on the backend)` : ''}
                                </p>
                            )}
                        </div>

                        {/* Filters */}
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4 items-end">
                                <div className="space-y-1 lg:col-span-1">
                                    <label className="text-sm font-semibold text-slate-700 block">Title</label>
                                    <input
                                        type="text"
                                        placeholder="Enter Title"
                                        className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-400"
                                        value={filterTitle}
                                        onChange={(e) => setFilterTitle(e.target.value)}
                                        onKeyDown={(e) => e.key === 'Enter' && handleFilter()}
                                    />
                                </div>

                                <div className="space-y-1">
                                    <label className="text-sm font-semibold text-slate-700 block">From Date</label>
                                    <input
                                        type="date"
                                        className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-slate-700"
                                        value={filterFromDate}
                                        onChange={(e) => setFilterFromDate(e.target.value)}
                                    />
                                </div>

                                <div className="space-y-1">
                                    <label className="text-sm font-semibold text-slate-700 block">To Date</label>
                                    <input
                                        type="date"
                                        className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-slate-700"
                                        value={filterToDate}
                                        onChange={(e) => setFilterToDate(e.target.value)}
                                    />
                                </div>

                                <div className="grid grid-cols-2 gap-2 lg:col-span-1">
                                    {activeQuickFilter !== 'dividend' && (
                                        <>
                                            <div className="space-y-1">
                                                <label className="text-sm font-semibold text-slate-700 block">Body</label>
                                                <select
                                                    className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-slate-700 bg-white"
                                                    value={filterBody}
                                                    onChange={(e) => setFilterBody(e.target.value)}
                                                >
                                                    <option value="All">All</option>
                                                    <option value="NSE">NSE</option>
                                                    <option value="NCL">NCL (NSE Clearing)</option>
                                                    <option value="BSE">BSE</option>
                                                    <option value="SEBI">SEBI</option>
                                                    <option value="MCX">MCX</option>
                                                    <option value="MCXCCL">MCXCCL</option>
                                                    <option value="IFSCA">IFSCA</option>
                                                </select>
                                            </div>
                                            <div className="space-y-1">
                                                <label className="text-sm font-semibold text-slate-700 block">Category</label>
                                                <select
                                                    className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-slate-700 bg-white"
                                                    value={filterCategory}
                                                    onChange={(e) => setFilterCategory(e.target.value)}
                                                >
                                                    <option value="All">All</option>
                                                    {availableCategories.map(cat => (
                                                        <option key={cat} value={cat}>{cat}</option>
                                                    ))}
                                                </select>
                                            </div>
                                        </>
                                    )}
                                </div>

                                <div className="flex gap-2 lg:col-span-1">
                                    <button
                                        onClick={handleFilter}
                                        className="flex-1 bg-[#0a0a2a] hover:bg-[#1a1a4a] text-white font-medium py-2 px-6 rounded-lg shadow-md transition-colors flex items-center justify-center gap-2"
                                    >
                                        <Icon name="search" className="w-4 h-4" /> Show
                                    </button>
                                    <button
                                        onClick={handleReset}
                                        title="Reset Filters"
                                        className="bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium py-2 px-3 rounded-lg border border-slate-300 transition-colors flex items-center justify-center"
                                    >
                                        <Icon name="rotate-ccw" className="w-4 h-4" />
                                    </button>
                                </div>
                            </div>
                            
                            <div className="mt-4 pt-4 border-t border-slate-100 flex flex-wrap items-center gap-3">
                                <button 
                                    onClick={() => toggleQuickFilter('P1')}
                                    className={`text-sm font-bold px-4 py-1.5 rounded-full transition-colors ${
                                        activeQuickFilter === 'P1' 
                                        ? 'bg-red-600 text-white shadow-sm border border-red-600' 
                                        : 'bg-red-50 text-red-700 hover:bg-red-100 border border-red-200'
                                    }`}
                                >
                                    P1 (Critical)
                                </button>
                                
                                <button 
                                    onClick={() => toggleQuickFilter('P2')}
                                    className={`text-sm font-bold px-4 py-1.5 rounded-full transition-colors ${
                                        activeQuickFilter === 'P2' 
                                        ? 'bg-amber-500 text-white shadow-sm border border-amber-500' 
                                        : 'bg-amber-50 text-amber-700 hover:bg-amber-100 border border-amber-200'
                                    }`}
                                >
                                    P2 (High)
                                </button>
                                
                                <button 
                                    onClick={() => toggleQuickFilter('P3')}
                                    className={`text-sm font-bold px-4 py-1.5 rounded-full transition-colors ${
                                        activeQuickFilter === 'P3' 
                                        ? 'bg-blue-600 text-white shadow-sm border border-blue-600' 
                                        : 'bg-blue-50 text-blue-700 hover:bg-blue-100 border border-blue-200'
                                    }`}
                                >
                                    P3 (Medium)
                                </button>

                                <div className="w-px h-5 bg-slate-300 mx-1"></div>
                                
                                <button 
                                    onClick={() => toggleQuickFilter('dividend')}
                                    className={`text-sm font-medium px-4 py-1.5 rounded-full transition-colors flex items-center gap-1.5 ${
                                        activeQuickFilter === 'dividend'
                                        ? 'bg-emerald-600 text-white shadow-sm border border-emerald-600'
                                        : 'bg-emerald-50 text-emerald-700 hover:bg-emerald-100 border border-emerald-200'
                                    }`}
                                >
                                    <Icon name="banknote" className="w-3.5 h-3.5" /> Dividend
                                </button>
                            </div>
                        </div>

                        {/* Data Tables */}
                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                            {activeQuickFilter === 'dividend' ? (
                                <div className="overflow-x-auto table-container">
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="bg-slate-50 border-b border-slate-200 text-slate-700">
                                                <th className="px-6 py-4 font-semibold text-sm whitespace-nowrap">Symbol</th>
                                                <th className="px-6 py-4 font-semibold text-sm whitespace-nowrap">Company</th>
                                                <th className="px-6 py-4 font-semibold text-sm whitespace-nowrap">Dividend</th>
                                                <th className="px-6 py-4 font-semibold text-sm whitespace-nowrap">Ex Date</th>
                                                <th className="px-6 py-4 font-semibold text-sm whitespace-nowrap">Record Date</th>
                                                <th className="px-6 py-4 font-semibold text-sm whitespace-nowrap">Face Value</th>
                                                <th className="px-6 py-4 font-semibold text-sm min-w-[250px]">Summary</th>
                                                <th className="px-6 py-4 font-semibold text-sm text-center whitespace-nowrap">Document</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-200">
                                            {isLoading ? (
                                                <tr>
                                                    <td colSpan="8" className="px-6 py-16 text-center text-slate-500">
                                                        <div className="flex flex-col items-center justify-center space-y-3">
                                                            <Icon name="loader-2" className="w-8 h-8 text-indigo-600 animate-spin" />
                                                            <p className="text-base font-medium">Fetching live circulars and notices…</p>
                                                        </div>
                                                    </td>
                                                </tr>
                                            ) : pagedData.length > 0 ? (
                                                pagedData.map((row) => {
                                                    const rowKey = getRowKey(row);
                                                    const summaryState = rowSummaries[rowKey];
                                                    const effectiveSummary = summaryState?.text ?? row.summary;
                                                    
                                                    return (
                                                        <tr key={rowKey} className="hover:bg-slate-50 transition-colors group">
                                                            <td className="px-6 py-4 text-sm font-medium text-slate-800">{row.symbol}</td>
                                                            <td className="px-6 py-4 text-sm text-slate-600">{row.company}</td>
                                                            <td className="px-6 py-4 text-sm font-medium text-slate-800">{extractDividendAmount(row.subject)}</td>
                                                            <td className="px-6 py-4 text-sm text-slate-600">{row.ex_date}</td>
                                                            <td className="px-6 py-4 text-sm text-slate-600">{row.record_date}</td>
                                                            <td className="px-6 py-4 text-sm text-slate-600">{row.face_value}</td>
                                                            <td className="px-6 py-4">
                                                                {effectiveSummary ? (
                                                                    <div className="flex flex-col items-start gap-1">
                                                                        <p className="text-xs text-slate-700 leading-relaxed max-w-sm">
                                                                            {effectiveSummary}
                                                                        </p>
                                                                    </div>
                                                                ) : summaryState?.loading ? (
                                                                    <span className="text-xs text-slate-400 flex items-center gap-1.5">
                                                                        <Icon name="loader-2" className="w-3.5 h-3.5 animate-spin" /> Generating...
                                                                    </span>
                                                                ) : summaryState?.error ? (
                                                                    <div className="flex flex-col items-start gap-1">
                                                                        <span className="text-[11px] text-red-600">{summaryState.message || 'Could not generate summary.'}</span>
                                                                    </div>
                                                                ) : (
                                                                    <div className="flex items-center gap-2">
                                                                        <span className="text-xs text-slate-400 italic whitespace-nowrap">Summary pending…</span>
                                                                    </div>
                                                                )}
                                                            </td>
                                                            <td className="px-6 py-4 text-center">
                                                                <a
                                                                    href={row.link}
                                                                    target="_blank"
                                                                    rel="noopener noreferrer"
                                                                    className="inline-flex items-center justify-center p-2 text-indigo-600 hover:text-white hover:bg-indigo-600 rounded-lg transition-colors border border-transparent hover:border-indigo-600"
                                                                    title="Open document"
                                                                >
                                                                    <Icon name="file-text" className="w-5 h-5" />
                                                                </a>
                                                            </td>
                                                        </tr>
                                                    );
                                                })
                                            ) : (
                                                <tr>
                                                    <td colSpan="8" className="px-6 py-12 text-center text-slate-500">
                                                        <div className="flex flex-col items-center justify-center">
                                                            <Icon name="search-x" className="w-10 h-10 text-slate-300 mb-3" />
                                                            <p className="text-base font-medium">No dividend records found</p>
                                                        </div>
                                                    </td>
                                                </tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            ) : (
                                <div className="overflow-x-auto table-container">
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="bg-slate-50 border-b border-slate-200 text-slate-700">
                                                <th className="px-6 py-4 font-semibold text-sm whitespace-nowrap">Regulatory Body</th>
                                                <th className="px-6 py-4 font-semibold text-sm whitespace-nowrap">Date</th>
                                                <th className="px-6 py-4 font-semibold text-sm whitespace-nowrap">Category</th>
                                                <th className="px-6 py-4 font-semibold text-sm min-w-[300px]">Title</th>
                                                <th className="px-6 py-4 font-semibold text-sm min-w-[250px]">Summary</th>
                                                <th className="px-6 py-4 font-semibold text-sm text-center whitespace-nowrap">Document</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-200">
                                            {isLoading ? (
                                                <tr>
                                                    <td colSpan="6" className="px-6 py-16 text-center text-slate-500">
                                                        <div className="flex flex-col items-center justify-center space-y-3">
                                                            <Icon name="loader-2" className="w-8 h-8 text-indigo-600 animate-spin" />
                                                            <p className="text-base font-medium">Fetching live circulars and notices…</p>
                                                        </div>
                                                    </td>
                                                </tr>
                                            ) : pagedData.length > 0 ? (
                                                pagedData.map((row) => {
                                                    const rowKey = getRowKey(row);
                                                    const summaryState = rowSummaries[rowKey];
                                                    const effectiveSummary = summaryState?.text ?? row.summary;

                                                    return (
                                                        <tr key={rowKey} className="hover:bg-slate-50 transition-colors group">
                                                            <td className="px-6 py-4">
                                                                <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium border ${bodyBadgeClass(row.body)}`}>
                                                                    {row.body}
                                                                </span>
                                                            </td>
                                                            <td className="px-6 py-4 text-sm text-slate-600 whitespace-nowrap">
                                                                {row.date ? new Date(row.date).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : ''}
                                                            </td>
                                                            <td className="px-6 py-4">
                                                                <span className="text-sm text-slate-600">{row.category}</span>
                                                            </td>
                                                            <td className="px-6 py-4">
                                                                <div className="flex items-center gap-2">
                                                                    {row.priority && (
                                                                        <span className={`inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider shrink-0
                                                                            ${row.priority === 'P1' ? 'bg-red-100 text-red-700 border border-red-200' : 
                                                                              row.priority === 'P2' ? 'bg-amber-100 text-amber-700 border border-amber-200' : 
                                                                              'bg-blue-100 text-blue-700 border border-blue-200'}`}
                                                                        >
                                                                            {row.priority}
                                                                        </span>
                                                                    )}
                                                                    <p className="text-sm font-medium text-slate-800 line-clamp-2" title={cleanTitle(row.title)}>
                                                                        {cleanTitle(row.title)}
                                                                    </p>
                                                                </div>
                                                            </td>
                                                            <td className="px-6 py-4">
                                                                {effectiveSummary ? (
                                                                    <p className="text-xs text-slate-700 leading-relaxed max-w-sm">
                                                                        {effectiveSummary}
                                                                    </p>
                                                                ) : summaryState?.loading ? (
                                                                    <span className="text-xs text-slate-400 flex items-center gap-1.5">
                                                                        <Icon name="loader-2" className="w-3.5 h-3.5 animate-spin" /> Generating...
                                                                    </span>
                                                                ) : summaryState?.error ? (
                                                                    <div className="flex flex-col items-start gap-1">
                                                                        <span className="text-[11px] text-red-600">{summaryState.message || 'Could not generate summary.'}</span>
                                                                    </div>
                                                                ) : (
                                                                    <span className="text-xs text-slate-400 italic whitespace-nowrap">Summary pending…</span>
                                                                )}
                                                            </td>
                                                            <td className="px-6 py-4 text-center">
                                                                <a
                                                                    href={row.link}
                                                                    target="_blank"
                                                                    rel="noopener noreferrer"
                                                                    className="inline-flex items-center justify-center p-2 text-indigo-600 hover:text-white hover:bg-indigo-600 rounded-lg transition-colors border border-transparent hover:border-indigo-600"
                                                                    title="Open document"
                                                                >
                                                                    <Icon name="file-text" className="w-5 h-5" />
                                                                </a>
                                                            </td>
                                                        </tr>
                                                    );
                                                })
                                            ) : (
                                                <tr>
                                                    <td colSpan="6" className="px-6 py-12 text-center text-slate-500">
                                                        <div className="flex flex-col items-center justify-center">
                                                            <Icon name="search-x" className="w-10 h-10 text-slate-300 mb-3" />
                                                            <p className="text-base font-medium">No records found</p>
                                                            <p className="text-sm mt-1">Try turning off active Quick Filters or adjusting the dates.</p>
                                                        </div>
                                                    </td>
                                                </tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            )}

                            {displayedData.length > 0 && (
                                <div className="bg-slate-50 border-t border-slate-200 px-6 py-3 flex items-center justify-between text-sm text-slate-500">
                                    <span>
                                        Showing {(page - 1) * PAGE_SIZE + 1}-{Math.min(page * PAGE_SIZE, displayedData.length)} of {displayedData.length} entries
                                    </span>
                                    <div className="flex items-center gap-2">
                                        <button
                                            onClick={() => setPage(p => Math.max(1, p - 1))}
                                            disabled={page <= 1}
                                            className="p-1.5 rounded-md border border-slate-300 disabled:opacity-40 hover:bg-slate-100"
                                        >
                                            <Icon name="chevron-left" className="w-4 h-4" />
                                        </button>
                                        <span>Page {page} of {totalPages}</span>
                                        <button
                                            onClick={() => setPage(p => Math.min(totalPages, p + 1))}
                                            disabled={page >= totalPages}
                                            className="p-1.5 rounded-md border border-slate-300 disabled:opacity-40 hover:bg-slate-100"
                                        >
                                            <Icon name="chevron-right" className="w-4 h-4" />
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
